<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity · Satellite Energy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand">Satellite Energy</a>
    <nav>
      <a href="sample.html">Sample Problems</a>
      <a href="credits.html">Credits</a>
    </nav>
  </header>

  <main id="app">
    <!-- Setup -->
    <section id="setup" class="panel">
      <h1>Set up your mission</h1>
      <p class="muted">Choose how the givens for your session should be picked.</p>

      <fieldset>
        <legend>Personalization</legend>
        <label><input type="radio" name="mode" value="preset" checked> Preset</label>
        <label><input type="radio" name="mode" value="custom"> Custom</label>
        <label><input type="radio" name="mode" value="auto"> Auto randomize</label>
      </fieldset>

      <div id="preset-panel" class="subpanel">
        <label for="preset-select">Preset</label>
        <select id="preset-select"></select>
      </div>

      <div id="custom-panel" class="subpanel hidden">
        <div class="grid3">
          <label>Mass m (kg) <input type="number" id="input-m" step="50"></label>
          <label>r1 (m) <input type="number" id="input-r1" step="100000"></label>
          <label>r2 (m) <input type="number" id="input-r2" step="100000"></label>
        </div>
      </div>

      <div id="auto-panel" class="subpanel hidden">
        <p class="muted">Givens will be randomized within bounds at the start of each session.</p>
        <button id="auto-reroll" type="button">Preview a random set</button>
        <p id="auto-preview" class="preview"></p>
      </div>

      <div class="preview-card">
        <h3>Session preview</h3>
        <p id="preview-givens"></p>
        <p id="preview-check" class="muted"></p>
      </div>

      <label for="session-count">Number of questions</label>
      <select id="session-count">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="15">15</option>
      </select>

      <button id="start-btn" type="button" class="primary">Start session</button>
    </section>

    <!-- Quiz -->
    <section id="quiz" class="panel hidden">
      <div class="quiz-header">
        <span id="progress-text">Question 1 of 10</span>
        <span id="item-tag"></span>
      </div>
      <div class="progressbar"><div id="progress-fill"></div></div>

      <div id="question-body"></div>

      <div id="hint-box" class="hint hidden"></div>

      <div class="actions">
        <button id="hint-btn" type="button" class="ghost hidden">Show hint</button>
        <button id="check-btn" type="button" class="primary">Check</button>
        <button id="next-btn" type="button" class="primary hidden">Next</button>
      </div>

      <div id="feedback" class="feedback hidden"></div>
      <div id="solution-box" class="solution hidden"></div>
    </section>

    <!-- Results -->
    <section id="results" class="panel hidden">
      <h1>Session complete</h1>
      <p id="score-line"></p>
      <div id="breakdown"></div>
      <h2>Review missed questions</h2>
      <div id="review"></div>
      <div class="actions">
        <button id="retake-same" type="button" class="ghost">Retake with same givens</button>
        <button id="retake-new" type="button" class="primary">Retake with new questions</button>
        <a href="index.html" class="ghost">Back to home</a>
      </div>
    </section>
  </main>

  <script type="module" src="js/quiz.js"></script>
</body>
</html>
